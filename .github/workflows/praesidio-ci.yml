# SPDX-License-Identifier: Apache-2.0
# PRAESIDIO AI, 2026-11-19: validation only, no deployment or package publishing.
name: PRAESIDIO validation
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'website/**'
      - 'sdk/python/**'
      - 'scripts/**'
      - '.github/workflows/praesidio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: praesidio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [frontend, website]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - if: matrix.app == 'website'
        run: npm run lint && npm run typecheck
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go build ./cmd/praesidio
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './sdk/python[dev]' pip-audit
      - run: python -m pytest sdk/python/tests
      - run: python -m pip_audit
